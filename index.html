    /* =========================================================================
       2. WEB AUDIO API + OPTIONAL MP3 SOUND ENGINE (WITH LOCALSTORAGE SETTINGS)
       ========================================================================= */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.droneGain = null;
        this.windGain = null;
        this.staticNode = null;
        this.isStaticPlaying = false;
        this.onPlatform = false;
        this.mp3Tracks = {};
        this.settings = this.loadSettings();
        this.enabled = !this.settings.muted;
      }

      loadSettings() {
        try {
          const raw = localStorage.getItem('train0214_audio_settings');
          if (raw) {
            const parsed = JSON.parse(raw);
            return {
              master: typeof parsed.master === 'number' ? parsed.master : 0.85,
              ambience: typeof parsed.ambience === 'number' ? parsed.ambience : 0.75,
              sfx: typeof parsed.sfx === 'number' ? parsed.sfx : 0.90,
              muted: Boolean(parsed.muted)
            };
          }
        } catch (e) {}
        return { master: 0.85, ambience: 0.75, sfx: 0.90, muted: false };
      }

      saveSettings() {
        try {
          localStorage.setItem('train0214_audio_settings', JSON.stringify(this.settings));
        } catch (e) {}
      }

      getAmbGain() { return this.enabled ? this.settings.master * this.settings.ambience : 0; }
      getSfxGain() { return this.enabled ? this.settings.master * this.settings.sfx : 0; }

      setVolume(type, normVal) {
        this.settings[type] = Math.max(0, Math.min(1, normVal));
        this.saveSettings();
        this.updateAmbienceLevels();
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
          this.startAmbience();
          this.probeOptionalAudio();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }

      probeOptionalAudio() {
        const files = ['amb_train_loop', 'amb_platform_wind', 'sfx_shutter', 'sfx_horn', 'sfx_footstep'];
        files.forEach(name => {
          const a = new Audio(`./assets/audio/${name}.mp3`);
          a.preload = 'auto';
          if (name.startsWith('amb_')) a.loop = true;
          a.addEventListener('canplaythrough', () => {
            this.mp3Tracks[name] = a;
            this.updateAmbienceLevels();
          }, { once: true });
        });
      }

      playOptionalSfx(name) {
        const track = this.mp3Tracks[name];
        const vol = this.getSfxGain();
        if (!track || vol <= 0) return false;
        try {
          const clone = track.cloneNode();
          clone.volume = vol;
          clone.play().catch(() => {});
          return true;
        } catch (e) { return false; }
      }

      toggle() {
        this.enabled = !this.enabled;
        this.settings.muted = !this.enabled;
        this.saveSettings();
        this.updateAmbienceLevels();
        if (!this.enabled) this.setStaticLock(false);
        return this.enabled;
      }

      setPlatformAmbience(isPlatform) {
        this.onPlatform = isPlatform;
        this.updateAmbienceLevels();
      }

      updateAmbienceLevels() {
        const amb = this.getAmbGain();
        // Optional MP3 Ambience
        const trainMp3 = this.mp3Tracks['amb_train_loop'];
        const windMp3 = this.mp3Tracks['amb_platform_wind'];
        const useTrainMp3 = Boolean(trainMp3);
        const useWindMp3 = Boolean(windMp3);

        if (trainMp3) {
          const shouldPlay = amb > 0 && !this.onPlatform && (!game || game.chapter === 1);
          trainMp3.volume = amb * 0.65;
          if (shouldPlay && trainMp3.paused) trainMp3.play().catch(() => {});
          else if (!shouldPlay && !trainMp3.paused) trainMp3.pause();
        }
        if (windMp3) {
          const shouldPlay = amb > 0 && this.onPlatform;
          windMp3.volume = amb * 0.7;
          if (shouldPlay && windMp3.paused) windMp3.play().catch(() => {});
          else if (!shouldPlay && !windMp3.paused) windMp3.pause();
        }

        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        if (this.droneGain) this.droneGain.gain.setTargetAtTime(!useTrainMp3 && !this.onPlatform ? 0.055 * amb : 0, t, 0.25);
        if (this.windGain) this.windGain.gain.setTargetAtTime(!useWindMp3 && this.onPlatform ? 0.12 * amb : 0, t, 0.35);
      }

      createNoiseBuffer(seconds = 2.0) {
        const len = Math.floor(this.ctx.sampleRate * seconds);
        const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        return buf;
      }

      startAmbience() {
        const amb = this.getAmbGain();
        const osc = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();
        osc.type = 'triangle'; osc.frequency.value = 43;
        filter.type = 'lowpass'; filter.frequency.value = 100;
        gain.gain.value = 0.055 * amb;
        osc.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
        osc.start();
        this.droneGain = gain;

        const windSrc = this.ctx.createBufferSource();
        windSrc.buffer = this.createNoiseBuffer(3.0);
        windSrc.loop = true;
        const windBp = this.ctx.createBiquadFilter();
        windBp.type = 'bandpass'; windBp.frequency.value = 340; windBp.Q.value = 2.5;
        const wGain = this.ctx.createGain();
        wGain.gain.value = 0;
        windSrc.connect(windBp); windBp.connect(wGain); wGain.connect(this.ctx.destination);
        windSrc.start();
        this.windGain = wGain;

        let beat = 0;
        setInterval(() => {
          if (!this.enabled || !this.ctx || this.ctx.state !== 'running' || this.onPlatform || this.mp3Tracks['amb_train_loop']) return;
          if (game && game.chapter === 2) return;
          if (beat === 0 || beat === 1) this.playRailClack(beat === 0 ? 1.0 : 0.65);
          beat = (beat + 1) % 6;
        }, 240);
      }

      playRailClack(intensity = 1.0) {
        const amb = this.getAmbGain();
        if (amb <= 0) return;
        try {
          const now = this.ctx.currentTime;
          const src = this.ctx.createBufferSource();
          src.buffer = this.createNoiseBuffer(0.08);
          const bp = this.ctx.createBiquadFilter();
          bp.type = 'bandpass'; bp.frequency.value = 130 + Math.random() * 35;
          const g = this.ctx.createGain();
          g.gain.setValueAtTime(0.065 * intensity * amb, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.075);
          src.connect(bp); bp.connect(g); g.connect(this.ctx.destination);
          src.start(now);
        } catch (e) {}
      }

      playFootstep() {
        const sfx = this.getSfxGain();
        if (sfx <= 0 || !this.ctx) return;
        if (this.playOptionalSfx('sfx_footstep')) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime((this.onPlatform ? 115 : 88) + Math.random() * 20, now);
        osc.frequency.exponentialRampToValueAtTime(32, now + 0.065);
        g.gain.setValueAtTime(0.11 * sfx, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.075);
      }

      playVoiceBlip(speaker = 'Kiên') {
        const sfx = this.getSfxGain();
        if (sfx <= 0 || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        let freq = 275;
        if (speaker.includes('Nấm')) freq = 540;
        else if (speaker.includes('Tùng')) freq = 185;
        else if (speaker.includes('Cầm')) freq = 365;
        else if (speaker.includes('Phong')) freq = 340;
        else if (speaker.includes('Soát Vé') || speaker.includes('Loa')) freq = 115;
        osc.type = (speaker.includes('Soát Vé') || speaker.includes('Loa')) ? 'sawtooth' : 'square';
        osc.frequency.setValueAtTime(freq + Math.random() * 32, now);
        g.gain.setValueAtTime(0.028 * sfx, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.028);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.03);
      }

      playShutter() {
        const sfx = this.getSfxGain();
        if (sfx <= 0 || !this.ctx) return;
        if (this.playOptionalSfx('sfx_shutter')) return;
        const now = this.ctx.currentTime;
        const src = this.ctx.createBufferSource();
        src.buffer = this.createNoiseBuffer(0.11);
        const hp = this.ctx.createBiquadFilter();
        hp.type = 'highpass'; hp.frequency.value = 1100;
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.32 * sfx, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        src.connect(hp); hp.connect(g); g.connect(this.ctx.destination);
        src.start(now);

        const whine = this.ctx.createOscillator();
        const wg = this.ctx.createGain();
        whine.type = 'sine';
        whine.frequency.setValueAtTime(680, now + 0.08);
        whine.frequency.exponentialRampToValueAtTime(3400, now + 1.4);
        wg.gain.setValueAtTime(0.001, now + 0.08);
        wg.gain.linearRampToValueAtTime(0.036 * sfx, now + 0.35);
        wg.gain.exponentialRampToValueAtTime(0.001, now + 1.45);
        whine.connect(wg); wg.connect(this.ctx.destination);
        whine.start(now + 0.08); whine.stop(now + 1.5);
      }

      setStaticLock(active) {
        if (!this.ctx) return;
        const sfx = this.getSfxGain();
        if (active && sfx > 0 && !this.isStaticPlaying) {
          this.isStaticPlaying = true;
          const src = this.ctx.createBufferSource();
          src.buffer = this.createNoiseBuffer(2.0);
          src.loop = true;
          const bp = this.ctx.createBiquadFilter();
          bp.type = 'bandpass'; bp.frequency.value = 2300; bp.Q.value = 1.6;
          const g = this.ctx.createGain();
          g.gain.value = 0.055 * sfx;
          src.connect(bp); bp.connect(g); g.connect(this.ctx.destination);
          src.start();
          this.staticNode = src;
        } else if ((!active || sfx <= 0) && this.isStaticPlaying) {
          this.isStaticPlaying = false;
          try { if (this.staticNode) this.staticNode.stop(); } catch (e) {}
          this.staticNode = null;
        }
      }

      playTicketPunch() {
        const sfx = this.getSfxGain();
        if (sfx <= 0 || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(1600, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.065);
        g.gain.setValueAtTime(0.28 * sfx, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.075);
      }

      playTrainWhistle() {
        const sfx = this.getSfxGain();
        if (sfx <= 0 || !this.ctx) return;
        if (this.playOptionalSfx('sfx_horn')) return;
        const now = this.ctx.currentTime;
        [106, 126, 152].forEach(f => {
          const osc = this.ctx.createOscillator();
          const lp = this.ctx.createBiquadFilter();
          const g = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(f, now);
          osc.frequency.linearRampToValueAtTime(f * 0.94, now + 2.3);
          lp.type = 'lowpass'; lp.frequency.value = 440;
          g.gain.setValueAtTime(0.001, now);
          g.gain.linearRampToValueAtTime(0.072 * sfx, now + 0.35);
          g.gain.exponentialRampToValueAtTime(0.001, now + 2.4);
          osc.connect(lp); lp.connect(g); g.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 2.5);
        });
      }

      playHorrorSwell() {
        const sfx = this.getSfxGain();
        if (sfx <= 0 || !this.ctx) return;
        const now = this.ctx.currentTime;
        [62, 66, 185].forEach(f => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sawtooth'; osc.frequency.value = f;
          g.gain.setValueAtTime(0.001, now);
          g.gain.linearRampToValueAtTime(0.085 * sfx, now + 0.45);
          g.gain.exponentialRampToValueAtTime(0.001, now + 2.0);
          osc.connect(g); g.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 2.1);
        });
      }

      playHorrorSting() {
        const sfx = this.getSfxGain();
        if (sfx <= 0 || !this.ctx) return;
        const now = this.ctx.currentTime;
        [520, 554, 780, 110].forEach(f => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = f < 200 ? 'triangle' : 'sawtooth';
          osc.frequency.setValueAtTime(f, now);
          osc.frequency.exponentialRampToValueAtTime(f * 0.86, now + 0.85);
          g.gain.setValueAtTime(0.001, now);
          g.gain.linearRampToValueAtTime((f < 200 ? 0.22 : 0.06) * sfx, now + 0.03);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
          osc.connect(g); g.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.95);
        });
      }

      playHeartbeat() {
        const sfx = this.getSfxGain();
        if (sfx <= 0 || !this.ctx) return;
        const now = this.ctx.currentTime;
        [0, 0.22, 0.72, 0.94].forEach((offset, idx) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(idx % 2 === 0 ? 64 : 52, now + offset);
          osc.frequency.exponentialRampToValueAtTime(28, now + offset + 0.14);
          g.gain.setValueAtTime(0.24 * sfx, now + offset);
          g.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.16);
          osc.connect(g); g.connect(this.ctx.destination);
          osc.start(now + offset); osc.stop(now + offset + 0.18);
        });
      }

      playBubbling() {
        const sfx = this.getSfxGain();
        if (sfx <= 0 || !this.ctx) return;
        const now = this.ctx.currentTime;
        for (let i = 0; i < 6; i++) {
          const t = now + i * 0.12;
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(160 + Math.random() * 140, t);
          osc.frequency.exponentialRampToValueAtTime(480 + Math.random() * 160, t + 0.09);
          g.gain.setValueAtTime(0.08 * sfx, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
          osc.connect(g); g.connect(this.ctx.destination);
          osc.start(t); osc.stop(t + 0.11);
        }
      }

      playClick(pitch = 540) {
        const sfx = this.getSfxGain();
        if (sfx <= 0 || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(pitch, now);
        g.gain.setValueAtTime(0.09 * sfx, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.05);
      }
    }

    function toggleLens(force = null) {
      if (!game.lens.unlocked) {
        showToast('Cò bấm máy ảnh kẹt cứng vì rỉ sét rồi! Hãy tìm dầu máy ở Toa 3 để sửa.');
        return;
      }
      if (game.dialogue.active) return;
      const next = force !== null ? force : !game.lens.active;
      game.lens.active = next;
      if (!next) {
        sound.setStaticLock(false);
        game.lens.lockedAnomaly = null;
      } else {
        sound.playClick(700);
        if (!game.flags.seenCameraFirstOpen) {
          game.flags.seenCameraFirstOpen = true;
          game.shakeTimer = 0.35;
          sound.playHorrorSwell();
          setTimeout(() => {

        }
      }
      updateHUD(); renderInventory();
    }

    function setupInputs() {
      window.addEventListener('keydown', e => {
        const k = e.key.toLowerCase();
        if (darkroom.active) {
          if (k === ' ') { e.preventDefault(); darkroom.holding = true; }
          if (k === 'escape') closeDarkroom();
          return;
        }

        if (k === 'escape') {
          const openSettings = document.getElementById('settings-modal').classList.contains('visible');
          if (openSettings) { closeModal('settings-modal'); return; }
          const otherModal = ['notebook-modal', 'polaroid-modal', 'padlock-modal'].find(id => document.getElementById(id).classList.contains('visible'));
          if (otherModal) { closeModal(otherModal); return; }
          if (game && game.lens.active) { toggleLens(false); return; }
          if (game && game.started && !game.dialogue.active) {
            sound.init(); syncSettingsUI(); openModal('settings-modal'); return;
          }
        }

        if (!game || !game.started) return;
        if (document.querySelector('.modal-overlay.visible')) return;

        if (game.dialogue.active) {
          if (k === ' ' || k === 'enter' || k === 'e') { e.preventDefault(); advanceDialogue(); }
          return;
        }

        if (k === 'a' || k === 'arrowleft') game.keys.left = true;
        if (k === 'd' || k === 'arrowright') game.keys.right = true;
        if (k === 'e') interactWithHotspot(game.activeHotspot);
        if (k === 'v') toggleLens();
        if (k === 'i') toggleInventoryDrawer();
        if (k === ' ') {
          e.preventDefault();
          if (game.lens.active) shootCamera();
          else if (game.activeHotspot) interactWithHotspot(game.activeHotspot);
        }
      });
